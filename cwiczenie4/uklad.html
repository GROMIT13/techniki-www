  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }

    .tresc h2 { margin-top: 0; }
    .kafel { border: 1px solid #000; padding: 1rem; min-height: 5rem; }

    /* ↓↓↓ TWOJE REGUŁY: najpierw telefon (kroki 1–2), potem @media (krok 3) ↓↓↓ */
    .strona {display: grid;}

    @media (min-width: 48rem) {
        .strona {
        
        }
    }

  </style>
</head>
<body>
  <div class="strona">
    <div class="naglowek">NAGŁÓWEK</div>
    <div class="menu">MENU</div>
    <div class="tresc">
      <h2>Treść</h2>
      <div class="kafle">
        <div class="kafel">1</div>
        <div class="kafel">2</div>
        <div class="kafel">3</div>
        <div class="kafel">4</div>
        <div class="kafel">5</div>
        <div class="kafel">6</div>
      </div>
    </div>
    <div class="boczny">BOCZNY</div>
    <div class="stopka">STOPKA</div>
  </div>
</body>
</html>
