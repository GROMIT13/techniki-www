<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ćw. 1 · BOX · Techniki WWW, zajęcia 04</title>
  <style>
    /* NIE otwieraj jeszcze w przeglądarce. Najpierw policz na kartce 4 liczby. */
    body { font-family: system-ui, sans-serif; margin: 2rem; }

    .scena { width: 400px; border: 1px dashed #888; }

    .a, .b {
      width: 200px;
      padding: 20px;
      border: 5px solid #000;
      margin: 10px;
    }

    .b { box-sizing: border-box; }

    .c {
      width: 50%;
      padding: 0 30px;
      border: 2px solid #000;
    }
  </style>
</head>
<body>
  <div class="scena">
    <div class="a">A</div>
    <div class="b">B</div>
    <div class="c">C</div>
  </div>
</body>
</html>
